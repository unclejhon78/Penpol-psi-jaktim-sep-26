<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Admin Absensi - Penpol PSI Jaktim</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #e31b23;
            margin-bottom: 5px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-success { background-color: #28a745; color: white; }
        .btn-primary { background-color: #0056b3; color: white; }
        .btn-disabled { background-color: #6c757d; color: white; cursor: not-allowed; }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            font-weight: bold;
            display: inline-block;
        }

        .badge-success { background-color: #28a745; }
        .badge-warning { background-color: #ffc107; color: #333; }
        .badge-info { background-color: #17a2b8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div>
            <h2>Portal Admin Registrasi Ulang Hari H</h2>
            <small>Sinkronisasi Otomatis dengan Google Sheets</small>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari nama / no HP...">
            <button class="btn btn-primary" onclick="loadData()">Refresh Data</button>
        </div>
    </div>

    <table id="adminTable">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Peserta</th>
                <th>No HP</th>
                <th>Wilayah</th>
                <th>Pengurus & Jabatan</th>
                <th>Status Kehadiran</th>
                <th>Aksi Verifikasi</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="7" style="text-align:center;">Memuat data dari Google Sheets...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwd86Kt51T7VhgQFFOhsbY1J-JMlZK7NDzrULQPQn4VsTOLzMVj1DGKSyttmjFodpiL/exec";
    let listPeserta = [];

    window.onload = function() {
        loadData();
    };

    function loadData() {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;">Memuat data...</td></tr>';
        
        fetch(SCRIPT_URL + "?action=getData")
        .then(res => res.json())
        .then(response => {
            if (Array.isArray(response)) {
                listPeserta = response;
            } else if (response.result === 'success' && Array.isArray(response.data)) {
                listPeserta = response.data;
            } else {
                listPeserta = [];
            }
            renderTable(listPeserta);
        })
        .catch(err => {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Gagal mengambil data dari Google Sheets. Pastikan Web App di-deploy dengan opsi "Anyone".</td></tr>';
            console.error(err);
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Belum ada peserta terdaftar.</td></tr>';
            return;
        }

        data.forEach((p, idx) => {
            const nama = p["Nama Lengkap"] || p.nama || "-";
            const email = p["Alamat Email"] || p.email || "";
            let rawHp = String(p["No. Hp"] || p["No HP"] || p.noHp || "-").trim();
        if (rawHp !== "-" && !rawHp.startsWith('0') && !rawHp.startsWith('62')) {
            rawHp = '0' + rawHp;
        }
        const noHp = rawHp;
            const kec = p["Kecamatan"] || p.kecamatan || "";
            const kel = p["Kelurahan"] || p.kelurahan || "";
            const pengurus = p["Tingkat Pengurus"] || p.pengurus || "";
            const jabatan = p["Jabatan"] || p.jabatan || "";
            
            // Cek apakah sudah hadir
            const isHadir = p["Status"] === "Hadir" || p["Status"] === "Hadir (Terverifikasi)" || p.statusHadir === true;

            const statusBadge = isHadir 
                ? '<span class="badge badge-success">✔ Terverifikasi Hadir</span>' 
                : '<span class="badge badge-warning">Belum Hadir</span>';

            const actionBtn = isHadir
                ? `<button class="btn btn-disabled" disabled>Sudah Absen</button>`
                : `<button class="btn btn-success" id="btn-${idx}" onclick="markAttendance(${idx})">Verifikasi Hadir</button>`;

            tbody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${nama}</strong><br><small>${email}</small></td>
                    <td>${noHp}</td>
                    <td>Kec. ${kec}<br>Kel. ${kel}</td>
                    <td>${pengurus} - ${jabatan}</td>
                    <td id="status-${idx}">${statusBadge}</td>
                    <td>${actionBtn}</td>
                </tr>
            `;
        });
    }

    function markAttendance(index) {
        const peserta = listPeserta[index];
        const namaPeserta = peserta["Nama Lengkap"] || peserta.nama || "Peserta";

        if (confirm(`Konfirmasi kehadiran untuk: ${namaPeserta}?`)) {
            const btn = document.getElementById(`btn-${index}`);
            const statusCell = document.getElementById(`status-${index}`);

            // Matikan tombol sementara saat proses pengiriman
            btn.disabled = true;
            btn.innerText = "Proses...";

            const payload = {
                action: 'absensi',
                nama: namaPeserta,
                noHp: peserta["No. Hp"] || peserta.noHp || "",
                pengurus: peserta["Tingkat Pengurus"] || peserta.pengurus || "",
                jabatan: peserta["Jabatan"] || peserta.jabatan || "",
                kecamatan: peserta["Kecamatan"] || peserta.kecamatan || "",
                kelurahan: peserta["Kelurahan"] || peserta.kelurahan || ""
            };

            const formData = new URLSearchParams();
            for (const key in payload) {
                formData.append(key, payload[key]);
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            })
            .then(() => {
                alert(`Kehadiran ${namaPeserta} berhasil dicatat di Sheet Kehadiran!`);
                
                // Ubah status & tombol secara langsung di tampilan tanpa harus refresh total
                statusCell.innerHTML = '<span class="badge badge-success">✔ Terverifikasi Hadir</span>';
                btn.className = "btn btn-disabled";
                btn.innerText = "Sudah Absen";
                
                // Tandai di variabel lokal
                listPeserta[index]["Status"] = "Hadir";
            })
            .catch(err => {
                alert('Gagal mencatat kehadiran.');
                btn.disabled = false;
                btn.innerText = "Verifikasi Hadir";
            });
        }
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = listPeserta.filter(p => {
            const nama = (p["Nama Lengkap"] || p.nama || "").toLowerCase();
            const hp = (p["No. Hp"] || p.noHp || "").toLowerCase();
            return nama.includes(query) || hp.includes(query);
        });
        renderTable(filtered);
    }
</script>

</body>
</html>
