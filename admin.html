<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Admin Absensi - Penpol PSI Jaktim</title>
    
    <!-- SUPABASE JS SDK & SHEETJS EXCEL LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #e31b23;
            margin-bottom: 5px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 230px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-success { background-color: #28a745; color: white; }
        .btn-primary { background-color: #0056b3; color: white; }
        .btn-excel { background-color: #1d6f42; color: white; }
        .btn-disabled { background-color: #6c757d; color: white; cursor: not-allowed; }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: white;
            font-weight: bold;
            display: inline-block;
        }

        .badge-success { background-color: #28a745; }
        .badge-warning { background-color: #ffc107; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div>
            <h2>Portal Kehadiran Registrasi Ulang</h2>
            <small>Database Supabase Real-Time</small>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari nama / no HP...">
            <button id="btnRefresh" class="btn btn-primary" onclick="loadData()">Refresh Data</button>
            <button class="btn btn-excel" onclick="exportToExcel()">Export Excel</button>
        </div>
    </div>

    <table id="adminTable">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Peserta</th>
                <th>No HP</th>
                <th>Wilayah</th>
                <th>Pengurus & Jabatan</th>
                <th>Status Kehadiran</th>
                <th>Aksi Verifikasi</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="7" style="text-align:center;">Memuat data dari Supabase...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // CONFIG SUPABASE (GANTI SESUAI PROJECT SUPABASE KAMU)
    const SUPABASE_URL = "https://egjmalhtyxtbmkplgrxu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_BlAodQ8yw8NBX20vVhaTRA__wyTK_64";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let listPeserta = [];

    // 1. AMBIL DATA DARI SUPABASE
    async function loadData() {
        const tableBody = document.getElementById('tableBody');
        const btnRefresh = document.getElementById('btnRefresh');
        
        btnRefresh.disabled = true;
        btnRefresh.innerText = "Memuat...";

        try {
            const { data, error } = await supabaseClient
                .from('pendaftaran')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            listPeserta = data;
            renderTable(listPeserta);
        } catch (error) {
            console.error("Gagal mengambil data:", error);
            tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Gagal mengambil data: ${error.message}</td></tr>`;
        } finally {
            btnRefresh.disabled = false;
            btnRefresh.innerText = "Refresh Data";
        }
    }

    document.addEventListener('DOMContentLoaded', loadData);

    // 2. RENDER TABLE
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Belum ada peserta terdaftar.</td></tr>';
            return;
        }

        data.forEach((p, idx) => {
            const nama = p.nama || "-";
            const email = p.email || "";
            
            let rawHp = String(p.no_hp || "-").trim();
            if (rawHp !== "-" && !rawHp.startsWith('0') && !rawHp.startsWith('62')) {
                rawHp = '0' + rawHp;
            }
            const noHp = rawHp;

            const kec = p.kecamatan || "";
            const kel = p.kelurahan || "";
            const pengurus = p.pengurus || "";
            const jabatan = p.jabatan || "";
            
            const isHadir = p.status === "Hadir" || p.status === "Hadir (Terverifikasi)";

            const statusBadge = isHadir 
                ? '<span class="badge badge-success">✔ Terverifikasi Hadir</span>' 
                : '<span class="badge badge-warning">Belum Hadir</span>';

            const actionBtn = isHadir
                ? `<button class="btn btn-disabled" disabled>Sudah Absen</button>`
                : `<button class="btn btn-success" id="btn-${p.id}" onclick="markAttendance(${p.id}, '${nama.replace(/'/g, "\\'")}')">Verifikasi Hadir</button>`;

            tbody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${nama}</strong><br><small>${email}</small></td>
                    <td>${noHp}</td>
                    <td>Kec. ${kec}<br>Kel. ${kel}</td>
                    <td>${pengurus} - ${jabatan}</td>
                    <td id="status-${p.id}">${statusBadge}</td>
                    <td>${actionBtn}</td>
                </tr>
            `;
        });
    }

    // 3. MARK ATTENDANCE
    async function markAttendance(id, namaPeserta) {
        if (confirm(`Konfirmasi kehadiran untuk: ${namaPeserta}?`)) {
            const btn = document.getElementById(`btn-${id}`);
            const statusCell = document.getElementById(`status-${id}`);

            btn.disabled = true;
            btn.innerText = "Proses...";

            try {
                const { error } = await supabaseClient
                    .from('pendaftaran')
                    .update({ status: 'Hadir (Terverifikasi)' })
                    .eq('id', id);

                if (error) throw error;

                alert(`Kehadiran ${namaPeserta} berhasil dicatat!`);
                statusCell.innerHTML = '<span class="badge badge-success">✔ Terverifikasi Hadir</span>';
                btn.className = "btn btn-disabled";
                btn.innerText = "Sudah Absen";

                const targetIndex = listPeserta.findIndex(p => p.id === id);
                if(targetIndex !== -1) {
                    listPeserta[targetIndex].status = 'Hadir (Terverifikasi)';
                }
            } catch (err) {
                alert('Gagal mencatat kehadiran: ' + err.message);
                btn.disabled = false;
                btn.innerText = "Verifikasi Hadir";
            }
        }
    }

    // 4. FILTER SEARCH
    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = listPeserta.filter(p => {
            const nama = (p.nama || "").toLowerCase();
            const hp = String(p.no_hp || "").toLowerCase();
            return nama.includes(query) || hp.includes(query);
        });
        renderTable(filtered);
    }

    // 5. EXPORT TO EXCEL (.XLSX)
    function exportToExcel() {
        if (listPeserta.length === 0) {
            alert("Tidak ada data untuk di-export!");
            return;
        }

        const excelData = listPeserta.map((p, idx) => ({
            "No": idx + 1,
            "Waktu Daftar": p.created_at,
            "Nama Lengkap": p.nama,
            "Jenis Kelamin": p.jenis_kelamin,
            "No HP": p.no_hp,
            "Email": p.email,
            "Kecamatan": p.kecamatan,
            "Kelurahan": p.kelurahan,
            "Pengurus": p.pengurus,
            "Jabatan": p.jabatan,
            "Status Kehadiran": p.status
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Pendaftaran");

        XLSX.writeFile(workbook, "Data_Pendaftaran_PSI_Jaktim.xlsx");
    }
</script>

</body>
</html>
